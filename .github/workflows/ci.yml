name: CI
# 推送到main分支时运行
on:
  push:
    branches:
      - main
  pull_request: # 对main分支的PR时运行
    branches:
      - main
  workflow_dispatch:

# CI只读权限，不授予写仓库、PR或发布包的权限
permissions:
  contents: read

# 同一分支连续推送时，取消旧的CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://insightforge:insightforge@localhost:5432/insightforge_test
      DATABASE_TEST_URL: postgresql://insightforge:insightforge@localhost:5432/insightforge_test
      REDIS_URL: redis://localhost:6379/1
      REDIS_TEST_URL: redis://localhost:6379/1

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: insightforge
          POSTGRES_PASSWORD: insightforge
          POSTGRES_DB: insightforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightforge -d insightforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Check database migrations
        run: pnpm --filter @insightforge/db db:check

      - name: Apply test database migrations
        run: pnpm --filter @insightforge/db db:migrate

      - name: Run tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser journeys
        run: pnpm e2e

      - name: Run deterministic agent evaluation
        run: pnpm eval:fixtures

      - name: Upload deterministic evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation-report
          path: evals/results/fixtures.*
          if-no-files-found: error

      - name: Build
        run: pnpm build

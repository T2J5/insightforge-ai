name: insightforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: insightforge
      POSTGRES_USER: insightforge
      POSTGRES_PASSWORD: insightforge
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightforge -d insightforge"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - insightforge-postgres-data:/var/lib/postgresql/data

volumes:
  insightforge-postgres-data:

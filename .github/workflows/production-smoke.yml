name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify public production journey
        env:
          INSIGHTFORGE_PUBLIC_URL: ${{ secrets.INSIGHTFORGE_PUBLIC_URL }}
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: pnpm smoke:production -- --base-url "$INSIGHTFORGE_PUBLIC_URL"
